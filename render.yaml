services:
  - type: web
    name: cinesphere-movie-portal
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn cinema_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
